# Publishes dist/ to GitHub Pages on every push to main.
# Release night: scheduled runs at 00:00 MSK on 2 Oct (21:00 UTC on 1 Oct, plus two retries,
# since GitHub may start scheduled runs late) redeploy with the post-release link preview.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '1 21 1 10 *'
    - cron: '15 21 1 10 *'
    - cron: '40 21 1 10 *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Post-release link preview (no-op before 2 Oct 00:00 MSK)
        run: python3 tools/release_meta.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
